<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />

    <!-- iOS 홈 화면 추가 아이콘 (Safari는 manifest 아이콘을 무시하고 이 태그를 사용) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="checky" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <!-- PWA (안드로이드·데스크톱 설치) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />

    <!--
      테마를 첫 페인트 전에 적용한다.
      번들이 로드된 뒤에 붙이면 다크 사용자에게 흰 화면이 한 번 번쩍인다.
      저장 키는 src/shared/stores/themeStore.ts 의 THEME_STORAGE_KEY 와 짝을 이룬다.
    -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("checky:theme") || "system";
          var isDark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#141414");
          }
        } catch (e) {
          // 저장소를 못 읽는 환경에서는 기본값(라이트)으로 둔다
        }
      })();
    </script>

    <title>checky</title>
    <meta
      name="description"
      content="todolist로, 어제 보다 더 나은 오늘을 위해"
    />

    <!-- Facebook Meta Tags -->
    <meta property="og:url" content="https://checky.today" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="checky" />
    <meta
      property="og:description"
      content="todolist로, 어제 보다 더 나은 오늘을 위해"
    />
    <meta property="og:image" content="https://checky.today/OG.png" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="twitter:domain" content="checky.today" />
    <meta property="twitter:url" content="https://checky.today" />
    <meta name="twitter:title" content="checky" />
    <meta
      name="twitter:description"
      content="todolist로, 어제 보다 더 나은 오늘을 위해"
    />
    <meta name="twitter:image" content="https://checky.today/OG.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      checky를 사용하려면 브라우저에서 JavaScript를 활성화해 주세요.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
