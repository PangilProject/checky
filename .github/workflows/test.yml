# PR 과 main 푸시마다 검사(타입·린트·단위 테스트)와 E2E 를 돌린다.
# E2E 는 Firebase 에뮬레이터 위에서 돌아 실제 프로젝트에 닿지 않고, 비밀값도 쓰지 않는다.
name: test

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새로 푸시하면 앞선 실행은 취소한다
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # firebase-tools 의 에뮬레이터는 JDK 21 이상이 필요하다
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci

      # 에뮬레이터 실행 파일은 firebase-tools 버전마다 받으므로 그 버전으로 캐시한다
      - id: firebase
        run: echo "version=$(node -p "require('firebase-tools/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ steps.firebase.outputs.version }}

      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

      # 실패하면 각 단계의 화면·기록(trace)을 내려받아 볼 수 있게 남긴다
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
